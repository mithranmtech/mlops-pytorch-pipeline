[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # asserts are fine
    "B008",  # FastAPI relies on function calls (File(...), Depends(...)) in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
