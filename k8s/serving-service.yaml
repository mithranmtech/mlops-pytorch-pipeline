apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  # ClusterIP for local clusters; switch to LoadBalancer on a cloud cluster.
  type: ClusterIP
  selector:
    app: model-serving
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
