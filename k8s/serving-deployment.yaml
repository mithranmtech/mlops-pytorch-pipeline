apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TRAINING_CONFIG_PATH
              value: /app/configs/training_config.yaml
          volumeMounts:
            - name: config
              mountPath: /app/configs
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: training-config
        - name: checkpoints
          persistentVolumeClaim:
            claimName: model-checkpoints-pvc
            readOnly: true
